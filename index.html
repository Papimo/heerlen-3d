<body>
<div id="view"></div>
<div id="pins"></div>

<header id="top">
  <div class="brand"><b>Parkstad</b><span>3D</span></div>
  <div id="search">
    <button id="qopen" class="round" title="Zoeken ( / )" aria-label="Zoeken"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
    <input id="q" type="search" autocomplete="off" placeholder="Zoek koffie, restaurant, winkel, straat…  ( / )">
    <button id="qx" title="Wissen">×</button>
    <div id="results" hidden></div>
  </div>
</header>
<nav id="chips"><details id="g-plek" class="grp"><summary title="Categorieën tonen/verbergen">📍 Plekken <small></small> <i>▾</i></summary><div id="chipl"></div></details></nav>

<div id="tools">
  <div class="seg">
    <button id="openf" title="Dichte plekken grijs maken (volgens de openingstijden in OpenStreetMap)">Nu open</button>
    <button id="dim" title="Andere gebouwen vager maken, zodat de plekken nog meer opvallen">Dimmen</button>
  </div>
  <details id="g-view" class="seg grp wide"><summary title="Kaartlagen, licht/sfeer en leven in de stad">🗺 Weergave <small></small> <i>▾</i></summary><div>
    <section id="g-kaart"><h3>🗺 Kaart <small></small></h3><div id="layers"></div></section>
    <section id="g-sfeer"><h3>✦ Sfeer <small></small></h3><div></div></section>
    <section id="g-stad"><h3>🏙 Stad <small></small></h3><div></div></section>
  </div></details>
  <button id="tour" class="seg" title="Rondleiding: vlieg een voor een langs je pins (of de plekken in beeld)">▶ Rondleiding</button>
  <div id="clock" title="Klok: dienstregeling en zon lopen hierop"><button id="clockt" title="Terug naar de echte tijd">--:--</button><button data-speed="1">×1</button><button data-speed="10">×10</button><button data-speed="60">×60</button></div>
  <button class="round" data-view="thuis" title="Terug naar het centrum">⌂</button>
  <button id="drivebtn" class="round" title="Rijden: zet de auto op een weg en stuur zelf (Esc = uitstappen)" aria-label="Rijden"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="19" r="1.6"/><circle cx="16.5" cy="19" r="1.6"/><path d="M5 11h14"/></svg></button>
  <div id="compass">
    <button data-rot="-1" title="Kwartslag linksom (Q)">⟲</button>
    <button class="round" data-view="noord" title="Noord boven"><i id="needle"><b>N</b></i></button>
    <button data-rot="1" title="Kwartslag rechtsom (E)">⟳</button>
  </div>
  <div id="zoom">
    <button data-zoom="1" title="Uitzoomen (−)">−</button>
    <button data-zoom="-1" title="Inzoomen (+)">+</button>
  </div>
  <details id="menu">
    <summary title="Mijn pins">⋯</summary>
    <div>
      <button data-m="export">Mijn pins exporteren</button>
      <button data-m="import">Pins importeren…</button>
      <p class="help"><b>Bediening</b><br>Slepen = schuiven · scrollen of − / + = zoomen · Q / E (of ⟲ ⟳) = kwartslag draaien · T = zachte randen · klik op een pand of plek voor info.</p>
    </div>
  </details>
  <input id="importfile" type="file" accept=".json,application/json" hidden>
</div>

<aside id="card" hidden></aside>
<div id="progress" hidden><i></i><span></span></div>
<footer id="attr"></footer>
<div id="nowebgl">Deze browser kan geen 3D (WebGL) tonen.</div>

<!-- iso-uitbreidingen (plan_iso.md): elk bestand haakt in via H3D.on / patchTerrain / addPost / animate; data eerst, dan code -->
<script>
// 96: grote data + de modules die ze lezen laden ná het eerste beeld (dynamische <script>, in volgorde, werkt via file://). ?nodefer = oude gedrag (alles synchroon).
(() => {
  const nodefer = /[?&]nodefer\b/.test(location.search), Q = [];
  // online (http/https) pakt tools/pack-site.cjs de grote data in als data/X.json (fetch + JSON.parse i.p.v. script-literal); file:// of ?nobin = de .js-bestanden zoals altijd
  const bin = !nodefer && /^https?:$/.test(location.protocol) && !/[?&]nobin\b/.test(location.search), PACK = { bgt: 1, props: 1, traffic: 1, transit: 1, spires: 1 }, P = {};
  const nm = src => src.replace(/^data\/|\.js$/g, '');
  window.H3D_WAIT = new Set(); // namen van data die nog onderweg is (iso/ground.js wacht op 'bgt')
  window.H3Dw = (src, wait) => {
    if (nodefer) { document.write('<script src="' + src + '"' + (src.startsWith('data/') ? ' onerror="this.remove()"' : '') + '><\/script>'); return; }
    Q.push(src); if (wait) window.H3D_WAIT.add(wait);
    if (bin) { // online: download start nu (parallel aan het eerste beeld); uitvoeren blijft in volgorde (H3Dgo)
      const n = nm(src);
      if (PACK[n] && src.startsWith('data/')) P[src] = fetch('data/' + n + '.json').then(r => { if (!r.ok) throw 0; return r.json(); }).catch(() => null); // null = terugval op het .js-script
      else { const l = document.createElement('link'); l.rel = 'preload'; l.as = 'script'; l.href = src; document.head.appendChild(l); }
    }
  };
  window.H3Dgo = () => {
    if (!Q.length) return;
    const runBin = () => Q.reduce((chain, src) => chain.then(() => new Promise(res => { // één voor één, in volgorde (iso/*.js leest H3D_DATA bij uitvoeren)
      const n = nm(src), fin = () => { if (window.H3D_WAIT.delete(n)) window.dispatchEvent(new Event('h3d-' + n)); res(); };
      const script = () => { const el = document.createElement('script'); el.src = src; el.onload = fin; el.onerror = () => { el.remove(); fin(); }; document.head.appendChild(el); };
      if (!P[src]) return script();
      P[src].then(d => { if (d === null) return script(); (window.H3D_DATA ||= {})[n] = d; fin(); });
    })), Promise.resolve());
    const run = bin ? runBin : () => Q.forEach(src => {
      const el = document.createElement('script'); el.src = src; el.async = false; // async=false: uitvoeren in toevoegvolgorde
      const done = () => { const n = src.replace(/^data\/|\.js$/g, ''); if (window.H3D_WAIT.delete(n)) window.dispatchEvent(new Event('h3d-' + n)); };
      el.onload = done; el.onerror = () => { el.remove(); done(); }; document.head.appendChild(el);
    });
    requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(run, 0))); // eerste beeld eerst
  };
  if (typeof H3D !== 'undefined') H3D.on('loaded', () => { window.H3D_LOADED = 1; }); // voor late modules (iso/traffic.js): 'loaded' komt maar één keer
})();
</script>
<script src="data/ground.js" onerror="this.remove()"></script>
<script>H3Dw("data/bgt.js", "bgt")</script>
<script>H3Dw("data/props.js")</script>
<script>H3Dw("data/traffic.js")</script>
<script>H3Dw("data/transit.js")</script>
<script>H3Dw("data/spires.js")</script>

<script>if (/^https?:$/.test(location.protocol) && "serviceWorker" in navigator) { const had = !!navigator.serviceWorker.controller; navigator.serviceWorker.register("sw.js").catch(() => {}); navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !window.h3dSwR) { window.h3dSwR = 1; location.reload(); } }); } // tweede bezoek uit cache (alleen online); nieuwe versie gepubliceerd → één keer herladen, anders zag je eerst de oude</script>
